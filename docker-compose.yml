# Uruchomienie całej aplikacji: docker compose up --build
# Potem wejdź na http://localhost:8080
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env (skopiuj .env.example)}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
