server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nagłówki bezpieczeństwa dla strony
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Zapytania do API przekazujemy do kontenera backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # PWA: service worker i index.html zawsze świeże (inaczej telefon trzymałby starą wersję)
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # React Router – każdy inny adres zwraca index.html
    location / {
        try_files $uri /index.html;
    }
}
