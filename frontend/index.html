<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mrrganizer – kocia spiżarnia i planer</title>
    <meta name="description" content="Spiżarnia karm, oceny kotów, plan karmienia i zadania." />

    <!-- PWA: ikona, kolor paska, tryb pełnoekranowy na iPhonie -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fff8f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mrrganizer" />
    <style>
      html, body { background: #fff8f1; margin: 0; }
      #splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; font-family: system-ui, -apple-system, sans-serif; color: #8a7470; text-align: center; padding: 24px; }
      #splash img { width: 96px; height: 96px; border-radius: 24px; }
      #splash-msg { max-width: 320px; font-size: 15px; }
    </style>
  </head>
  <body>
    <!-- Ekran ładowania: React podmienia go po starcie. Jeśli JS się wysypie, pokazujemy błąd zamiast białej strony. -->
    <div id="root">
      <div id="splash">
        <img src="/icon-192.png" alt="" />
        <div id="splash-msg">Ładowanie Mrrganizera…</div>
      </div>
    </div>
    <script>
      (function () {
        var msg = function (t) { var el = document.getElementById('splash-msg'); if (el) el.innerHTML = t; };
        window.addEventListener('error', function (e) {
          msg('🙀 Aplikacja nie wystartowała:<br><small>' + String(e.message || e.type) + '</small>');
        }, true);
        setTimeout(function () {
          msg('🙀 Długo to trwa… Sprawdź, czy komputer z aplikacją jest włączony i w tej samej sieci Wi-Fi.');
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
